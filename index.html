<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Answer Control Dashboard v4</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #111118;
            --bg-tertiary: #1a1a24;
            --text-primary: #e8e8ec;
            --text-secondary: #6e6e78;
            --accent-purple: #8b5cf6;
            --accent-pink: #ec4899;
            --accent-cyan: #06b6d4;
            --glass-bg: rgba(255, 255, 255, 0.02);
            --glass-border: rgba(255, 255, 255, 0.06);
            --glow-purple: 0 0 40px rgba(139, 92, 246, 0.15);
            --glow-hover: 0 0 60px rgba(139, 92, 246, 0.25);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated Background */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            z-index: 0;
        }
        .bg-orb-1 {
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, transparent 70%);
            top: -200px; right: -100px;
            animation: float 20s ease-in-out infinite;
        }
        .bg-orb-2 {
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.1) 0%, transparent 70%);
            bottom: -100px; left: -100px;
            animation: float 15s ease-in-out infinite reverse;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, -30px); }
        }

        /* App Layout */
        .app {
            display: flex;
            min-height: 100vh;
            position: relative;
            z-index: 1;
        }

        /* Sidebar - Icon-only by default, expands on hover */
        .sidebar {
            width: 72px;
            background: var(--bg-secondary);
            border-right: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 24px 0;
            position: fixed;
            height: 100vh;
            z-index: 100;
            transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .sidebar:hover { width: 220px; }
        
        .logo {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem;
            margin-bottom: 32px;
            box-shadow: var(--glow-purple);
            animation: pulse-glow 3s ease-in-out infinite;
        }
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 40px rgba(139, 92, 246, 0.3); }
            50% { box-shadow: 0 0 60px rgba(139, 92, 246, 0.5); }
        }

        .nav {
            display: flex; flex-direction: column; gap: 4px;
            width: 100%; padding: 0 12px;
        }
        .nav-item {
            display: flex; align-items: center; gap: 14px;
            padding: 14px;
            border-radius: 12px;
            cursor: pointer;
            color: var(--text-secondary);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        .nav-item::before {
            content: ''; position: absolute;
            inset: 0; border-radius: 12px;
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
            opacity: 0; transition: opacity 0.3s ease;
        }
        .nav-item:hover::before { opacity: 0.1; }
        .nav-item:hover { color: var(--text-primary); }
        .nav-item.active::before { opacity: 1; }
        .nav-item.active { color: white; }
        .nav-item.active .nav-icon { transform: scale(1.1); }
        .nav-icon { 
            width: 24px; height: 24px; 
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; position: relative; z-index: 1;
            transition: transform 0.2s ease;
        }
        .nav-label { 
            font-size: 0.9rem; font-weight: 500;
            opacity: 0; width: 0;
            transition: all 0.3s ease;
            white-space: nowrap;
            position: relative; z-index: 1;
        }
        .sidebar:hover .nav-label { opacity: 1; width: auto; }

        /* Main Content */
        .main {
            flex: 1; margin-left: 72px;
            padding: 24px;
            min-height: 100vh;
            transition: margin-left 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .sidebar:hover + .main { margin-left: 220px; }

        /* Header */
        .header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 28px; padding-bottom: 20px;
            border-bottom: 1px solid var(--glass-border);
        }
        .header-title {
            font-size: 1.8rem; font-weight: 700;
            background: linear-gradient(135deg, #fff, var(--accent-purple));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .header-meta {
            display: flex; gap: 12px; align-items: center;
            color: var(--text-secondary); font-size: 0.85rem;
        }
        .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #22c55e; box-shadow: 0 0 10px #22c55e;
            animation: status-pulse 2s ease-in-out infinite;
        }
        @keyframes status-pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* One Thing Banner */
        .banner {
            background: linear-gradient(135deg, rgba(234, 179, 8, 0.1), rgba(234, 179, 8, 0.02));
            border: 1px solid rgba(234, 179, 8, 0.2);
            border-radius: 16px; padding: 20px 24px;
            margin-bottom: 28px;
            display: flex; align-items: center; gap: 16px;
            position: relative; overflow: hidden;
        }
        .banner::before {
            content: ''; position: absolute; inset: 0;
            background: linear-gradient(90deg, transparent, rgba(234, 179, 8, 0.1), transparent);
            transform: translateX(-100%);
            animation: shimmer 4s infinite;
        }
        @keyframes shimmer {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(200%); }
        }
        .banner-label {
            font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
            color: #eab308; letter-spacing: 1px;
        }
        .banner-content {
            flex: 1; font-size: 1.1rem; font-weight: 500;
        }
        .banner-edit {
            background: rgba(234, 179, 8, 0.15);
            border: 1px solid rgba(234, 179, 8, 0.3);
            color: #eab308; padding: 8px 16px;
            border-radius: 8px; cursor: pointer;
            font-size: 0.8rem; font-weight: 500;
            transition: all 0.2s ease;
        }
        .banner-edit:hover {
            background: rgba(234, 179, 8, 0.25);
            transform: scale(1.05);
        }

        /* Glass Cards */
        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 24px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        .card::before {
            content: ''; position: absolute; inset: 0;
            border-radius: 20px;
            padding: 1px;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask-composite: exclude;
            pointer-events: none;
        }
        .card:hover {
            transform: translateY(-8px) scale(1.01);
            box-shadow: var(--glow-hover);
            border-color: rgba(139, 92, 246, 0.3);
        }

        /* Grid Layout */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 24px;
            margin-bottom: 28px;
        }
        @media (max-width: 768px) {
            .grid { grid-template-columns: 1fr; }
            .sidebar:hover { width: 72px; }
            .sidebar:hover + .main { margin-left: 72px; }
            .nav-label { display: none; }
        }

        .card-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px;
        }
        .card-title {
            font-size: 0.8rem; font-weight: 600;
            text-transform: uppercase; letter-spacing: 1px;
            color: var(--text-secondary);
        }
        .card-badge {
            padding: 4px 12px; border-radius: 20px;
            font-size: 0.75rem; font-weight: 600;
            background: rgba(139, 92, 246, 0.2);
            color: var(--accent-purple);
        }

        /* Weather Widget */
        .weather-card {
            background: linear-gradient(135deg, rgba(6,182,212,0.1), rgba(139,92,246,0.1));
        }
        .weather-main {
            display: flex; flex-direction: column; align-items: center;
            padding: 20px 0; text-align: center;
        }
        .weather-temp {
            font-size: 5rem; font-weight: 700;
            background: linear-gradient(135deg, #fff, #06b6d4);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            line-height: 1;
        }
        .weather-desc {
            font-size: 1.1rem; color: var(--text-secondary);
            margin-top: 8px;
        }
        .weather-location {
            font-size: 0.9rem; color: var(--text-secondary);
            margin-top: 4px;
        }
        .weather-forecast {
            display: flex; justify-content: space-around;
            margin-top: 24px; padding-top: 20px;
            border-top: 1px solid var(--glass-border);
        }
        .forecast-day { text-align: center; }
        .forecast-day-name {
            font-size: 0.75rem; color: var(--text-secondary);
            text-transform: uppercase;
        }
        .forecast-temp {
            font-size: 1.2rem; font-weight: 600;
            margin-top: 4px;
        }

        /* Tasks Widget with Drag */
        .task-list {
            display: flex; flex-direction: column; gap: 10px;
        }
        .task-item {
            display: flex; align-items: center; gap: 12px;
            padding: 14px; background: rgba(255,255,255,0.03);
            border-radius: 12px;
            cursor: grab;
            transition: all 0.2s ease;
            border: 2px solid transparent;
        }
        .task-item:hover { 
            background: rgba(255,255,255,0.06);
            border-color: rgba(139, 92, 246, 0.2);
        }
        .task-item.dragging {
            opacity: 0.5;
            transform: scale(1.02);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .task-item.drag-over {
            border-color: var(--accent-purple);
            transform: translateY(4px);
        }
        .task-checkbox {
            width: 20px; height: 20px; accent-color: var(--accent-purple);
            cursor: pointer;
        }
        .task-content { flex: 1; }
        .task-title { font-size: 0.95rem; font-weight: 500; }
        .task-title.done { 
            text-decoration: line-through; 
            color: var(--text-secondary);
        }
        .task-meta {
            font-size: 0.75rem; color: var(--text-secondary);
            margin-top: 2px;
        }
        .task-delete {
            opacity: 0; transition: opacity 0.2s;
            background: none; border: none; color: var(--text-secondary);
            cursor: pointer; font-size: 1.2rem;
        }
        .task-item:hover .task-delete { opacity: 1; }
        .task-delete:hover { color: #ef4444; }

        /* Gmail Widget */
        .gmail-card {
            position: relative;
        }
        .gmail-item {
            padding: 16px; margin-bottom: 10px;
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            border-left: 3px solid transparent;
            transition: all 0.2s ease;
            cursor: pointer;
        }
        .gmail-item:hover {
            background: rgba(255,255,255,0.05);
            transform: translateX(4px);
        }
        .gmail-item.action {
            border-left-color: var(--accent-purple);
            background: linear-gradient(90deg, rgba(139,92,246,0.1), transparent);
        }
        .gmail-header {
            display: flex; justify-content: space-between; align-items: flex-start;
            margin-bottom: 6px;
        }
        .gmail-subject {
            font-weight: 600; font-size: 0.95rem;
            display: -webkit-box; -webkit-line-clamp: 1;
            -webkit-box-orient: vertical; overflow: hidden;
        }
        .gmail-time {
            font-size: 0.75rem; color: var(--text-secondary);
            white-space: nowrap;
        }
        .gmail-sender {
            font-size: 0.85rem; color: var(--text-secondary);
            margin-bottom: 6px;
        }
        .gmail-preview {
            font-size: 0.8rem; color: var(--text-secondary);
            display: -webkit-box; -webkit-line-clamp: 2;
            -webkit-box-orient: vertical; overflow: hidden;
            line-height: 1.4;
        }
        .gmail-actions {
            display: flex; gap: 8px; margin-top: 12px;
            opacity: 0; transform: translateY(8px);
            transition: all 0.2s ease;
        }
        .gmail-item:hover .gmail-actions {
            opacity: 1; transform: translateY(0);
        }
        .btn-sm {
            padding: 6px 12px; border-radius: 8px;
            font-size: 0.75rem; font-weight: 500;
            cursor: pointer; border: none;
            transition: all 0.2s ease;
        }
        .btn-primary-sm {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-pink));
            color: white;
        }
        .btn-secondary-sm {
            background: rgba(255,255,255,0.1);
            color: var(--text-primary);
        }
        .btn-sm:hover { transform: translateY(-2px); }

        /* Calendar Widget */
        .calendar-widget iframe {
            width: 100%; height: 320px; border: none;
            border-radius: 12px;
            background: rgba(255,255,255,0.02);
        }

        /* System Status */
        .status-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }
        @media (max-width: 768px) {
            .status-grid { grid-template-columns: repeat(2, 1fr); }
        }

            display: flex; align-items: center; gap:/* Status Grid */

/* Mobile Bottom Nav */
@media (max-width: 768px) {
    .sidebar { display: none !important; }
    .main { margin-left: 0 !important; padding: 16px; }
    .mobile-nav {
        position: fixed; bottom: 0; left: 0; right: 0;
        background: var(--bg-secondary); border-top: 1px solid var(--glass-border);
        display: flex; justify-content: space-around; padding: 12px;
        z-index: 100;
    }
    .mobile-nav-item {
        display: flex; flex-direction: column; align-items: center;
        gap: 4px; color: var(--text-secondary); font-size: 0.7rem;
        cursor: pointer; padding: 8px 16px; border-radius: 8px;
    }
    .mobile-nav-item.active { color: var(--accent-purple); }

<body>
    <div class="bg-orb bg-orb-1"></div>
    <div class="bg-orb bg-orb-2"></div>
    
    <div class="app">
        <aside class="sidebar">
            <div class="logo">🦾</div>
            <nav class="nav">
                <div class="nav-item active" data-tab="dashboard"><span class="nav-icon">🏠</span><span class="nav-label">Dashboard</span></div>
                <div class="nav-item" data-tab="gmail"><span class="nav-icon">📧</span><span class="nav-label">Gmail</span></div>
                <div class="nav-item" data-tab="calendar"><span class="nav-icon">📅</span><span class="nav-label">Calendar</span></div>
                <div class="nav-item" data-tab="tasks"><span class="nav-icon">✅</span><span class="nav-label">Tasks</span></div>
                <div class="nav-item" data-tab="settings"><span class="nav-icon">⚙️</span><span class="nav-label">Settings</span></div>
            </nav>
        </aside>
        
        <main class="main">
            <header class="header">
                <h1 class="header-title">Answer Control</h1>
                <div class="header-meta">
                    <div class="status-dot"></div>
                    <span>All systems operational</span>
                </div>
            </header>
            
            <div class="banner" id="one-thing-banner">
                <span class="banner-label">Today's One Thing</span>
                <span class="banner-content" id="one-thing-text">Research BOX API for automation</span>
                <button class="banner-edit" onclick="editOneThing()">Edit</button>
            </div>
            
            <div class="grid" id="widget-grid">
                <!-- Widgets rendered here -->
            </div>
            
            <div class="card" style="margin-bottom: 100px;">
                <div class="card-header">
                    <span class="card-title">System Status</span>
                    <span class="card-badge">Live</span>
                </div>
                <div class="status-grid" id="status-grid"></div>
            </div>
        </main>
    </div>
    
    <nav class="mobile-nav">
        <div class="mobile-nav-item active" data-tab="dashboard"><span>🏠</span><span>Home</span></div>
        <div class="mobile-nav-item" data-tab="gmail"><span>📧</span><span>Gmail</span></div>
        <div class="mobile-nav-item" data-tab="tasks"><span>✅</span><span>Tasks</span></div>
        <div class="mobile-nav-item" data-tab="calendar"><span>📅</span><span>Calendar</span></div>
    </nav>

    <script>
        // Data
        const data = {
            weather: { temp: 72, condition: 'Clear', location: 'Dallas, TX', forecast: [
                { day: 'Thu', temp: '74°' }, { day: 'Fri', temp: '76°' }, { day: 'Sat', temp: '73°' }
            ]},
            tasks: [
                { id: 1, title: 'Research BOX API', done: false, priority: 'high', source: 'Personal' },
                { id: 2, title: 'Schedule structural engineer', done: false, priority: 'medium', source: 'Home' },
                { id: 3, title: 'Shop home insurance', done: false, priority: 'low', source: 'Finance' }
            ],
            gmail: [
                { id: 'eb7891', subject: 'FW: Everbright order for Simplicity Solar', sender: 'Everbright Systems', preview: 'Please find the attached invoice for your recent order. Terms: Net 30.', time: '2h ago', isAction: true },
                { id: 'q1pricing', subject: 'Q1 pricing update - Bright Energy', sender: 'Bright Energy', preview: 'Updated pricing for Q1 2026. See attached spreadsheet.', time: '4h ago', isAction: true }
            ],
            systems: [
                { name: 'Gmail Classifier', status: 'Running', icon: '✅' },
                { name: 'BOX Detector', status: 'Daily 6 PM', icon: '📁' },
                { name: 'Morning Brief', status: '6 AM daily', icon: '🌅' },
                { name: 'Overnight Thinking', status: '2 AM → 7 AM', icon: '🧠' }
            ]
        };

        // Render Functions
        function renderWidgets() {
            const grid = document.getElementById('widget-grid');
            grid.innerHTML = `
                <div class="card weather-card">
                    <div class="card-header">
                        <span class="card-title">${'☀️ Weather'}</span>
                    </div>
                    <div class="weather-main">
                        <div class="weather-temp">${data.weather.temp}°</div>
                        <div class="weather-desc">${data.weather.condition}</div>
                        <div class="weather-location">${data.weather.location}</div>
                    </div>
                    <div class="weather-forecast">
                        ${data.weather.forecast.map(f => `
                            <div class="forecast-day">
                                <div class="forecast-day-name">${f.day}</div>
                                <div class="forecast-temp">${f.temp}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <span class="card-title">✅ Tasks</span>
                        <span class="card-badge">${data.tasks.filter(t => !t.done).length}</span>
                    </div>
                    <div class="task-list" id="task-list">
                        ${data.tasks.map(t => renderTask(t)).join('')}
                    </div>
                </div>

                <div class="card gmail-card">
                    <div class="card-header">
                        <span class="card-title">📧 Recent Emails</span>
                        <span class="card-badge" style="background:rgba(239,68,68,0.2);color:#ef4444;">${data.gmail.length}</span>
                    </div>
                    <div id="gmail-list">
                        ${data.gmail.map(e => renderGmail(e)).join('')}
                    </div>
                </div>

                <div class="card">
                    <div class="card-header">
                        <span class="card-title">📅 Calendar</span>
                    </div>
                    <div class="calendar-widget">
                        <iframe src="https://calendar.google.com/calendar/embed?src=meseeksingram%40gmail.com&ctz=America%2FChicago&mode=AGENDA&showCalendars=0&showPrint=0&showTabs=0&showTz=0&showTitle=0" 
                                style="background:transparent;">
                        </iframe>
                    </div>
                </div>
            `;
        }

        function renderTask(task) {
            return `
                <div class="task-item" draggable="true" data-id="${task.id}">
                    <input type="checkbox" class="task-checkbox" ${task.done ? 'checked' : ''} 
                           onchange="toggleTask(${task.id})">
                    <div class="task-content">
                        <div class="task-title ${task.done ? 'done' : ''}">${escapeHTML(task.title)}</div>
                        <div class="task-meta">${task.source} • ${task.priority}</div>
                    </div>
                    <button class="task-delete" onclick="deleteTask(${task.id})">🗑️</button>
                </div>
            `;
        }

        function renderGmail(email) {
            return `
                <div class="gmail-item ${email.isAction ? 'action' : ''}">
                    <div class="gmail-header">
                        <div class="gmail-subject">${escapeHTML(email.subject)}</div>
                        <span class="gmail-time">${email.time}</span>
                    </div>
                    <div class="gmail-sender">${escapeHTML(email.sender)}</div>
                    <div class="gmail-preview">${escapeHTML(email.preview)}</div>
                    <div class="gmail-actions">
                        <button class="btn-sm btn-primary-sm" onclick="openGmail('${email.id}')">📧 Open</button>
                        ${email.isAction ? `<button class="btn-sm btn-secondary-sm" onclick="createTask('${email.id}')">➕ Task</button>` : ''}
                    </div>
                </div>
            `;
        }

        // Drag & Drop
        function initDragDrop() {
            const list = document.getElementById('task-list');
            if (!list) return;
            
            let draggedItem = null;
            
            list.addEventListener('dragstart', e => {
                if (e.target.classList.contains('task-item')) {
                    draggedItem = e.target;
                    e.target.classList.add('dragging');
